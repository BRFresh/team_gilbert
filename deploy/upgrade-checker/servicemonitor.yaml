apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: upgrade-checker
  namespace: upgrade-checker
  labels:
    app: upgrade-checker
spec:
  selector:
    matchLabels:
      app: upgrade-checker
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # The app allows five seconds for Kubernetes/OpenShift API collection.
      scrapeTimeout: 10s
