apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-checker-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusteroperators"]
  verbs: ["list"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions"]
  resourceNames: ["version"]
  verbs: ["get"]
- apiGroups: ["apiserver.openshift.io"]
  resources: ["apirequestcounts"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-checker-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-checker-reader
subjects:
- kind: ServiceAccount
  name: upgrade-checker
  namespace: upgrade-checker
