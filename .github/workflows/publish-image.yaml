name: Publish container image

on:
  workflow_dispatch:
  push:
    branches: [main, feat]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-image.yaml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref_name == 'main' || github.ref_name == 'feat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
      - name: Record deployable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo 'For a reproducible rollout, set this exact image in deploy/upgrade-checker/app.yaml:' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
