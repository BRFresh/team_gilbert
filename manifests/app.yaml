apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-web-app
  labels:
    app: test-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-web
  template:
    metadata:
      labels:
        app: test-web
    spec:
      containers:
      - name: nginx
        image: bitnami/nginx:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: test-web-service
  labels:
    app: test-web
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: test-web
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: test-web-route
  labels:
    app: test-web
spec:
  to:
    kind: Service
    name: test-web-service
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None