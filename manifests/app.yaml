apiVersion: apps/v1
kind: Deployment
metadata:
  name: upgrade-checker
  namespace: upgrade-checker
  labels:
    app: upgrade-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upgrade-checker
  template:
    metadata:
      labels:
        app: upgrade-checker
    spec:
      serviceAccountName: upgrade-checker
      containers:
      - name: upgrade-checker
        image:  nginxinc/nginx-unprivileged:stable
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"