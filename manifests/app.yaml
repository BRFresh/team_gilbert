apiVersion: apps/v1
kind: Deployment
metadata:
  name: upgrade-checker
  namespace: upgrade-checker
  labels:
    app: upgrade-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upgrade-checker
  template:
    metadata:
      labels:
        app: upgrade-checker
    spec:
      serviceAccountName: upgrade-checker
      containers:
        - name: upgrade-checker
          image: nginxinc/nginx-unprivileged:stable
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: test-metrics
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
      volumes:
        - name: test-metrics
          configMap:
            name: upgrade-checker-test-metrics