apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-checker
  Namespace: upgrade-checker

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-checker-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["config.openshift.io"]
    resources: ["clusteroperators", "clusterversions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apiserver.openshift.io"]
    resources: ["apirequestcounts"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: CLusterRoleBinding
metadata:
  name: upgrade-checker-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-checker-reader
subjects:
  - kind: ServiceAccount
    name: upgrade-checker
    namespace: upgrade-checker
