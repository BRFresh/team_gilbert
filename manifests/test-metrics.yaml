apiVersion: v1
kind: ConfigMap
metadata:
  name: upgrade-checker-test-metrics
  namespace: upgrade-checker
data:
  default.conf: |
    server {
        listen 8080;

        location /metrics {
            default_type "text/plain; version=0.0.4";
            return 200 '# HELP upgrade_ready Whether the cluster is ready for an upgrade
    # TYPE upgrade_ready gauge
    upgrade_ready 1

    # HELP upgrade_deprecated_apis Number of deprecated APIs detected
    # TYPE upgrade_deprecated_apis gauge
    upgrade_deprecated_apis 3
    ';
        }
    }