# After publishing, replace REPLACE_WITH_IMAGE_DIGEST with the sha256 digest
# from the GitHub Actions summary, then copy this file to manifests/app.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-checker
  namespace: upgrade-checker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-checker-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusteroperators"]
  verbs: ["list"]
- apiGroups: ["apiserver.openshift.io"]
  resources: ["apirequestcounts"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-checker-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-checker-reader
subjects:
- kind: ServiceAccount
  name: upgrade-checker
  namespace: upgrade-checker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-web-app
  namespace: upgrade-checker
  labels:
    app: test-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-web
  template:
    metadata:
      labels:
        app: test-web
    spec:
      serviceAccountName: upgrade-checker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: upgrade-checker
        image: ghcr.io/brfresh/team_gilbert@sha256:REPLACE_WITH_IMAGE_DIGEST
        args: ["-in-cluster", "-listen-address=:8080", "-api-timeout=5s"]
        ports:
        - name: metrics
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: test-web-service
  namespace: upgrade-checker
  labels:
    app: test-web
spec:
  ports:
  - port: 80
    targetPort: metrics
    protocol: TCP
    name: http
  selector:
    app: test-web
  type: ClusterIP
